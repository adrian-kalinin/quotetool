{% load static django_htmx i18n %}

{% get_current_language as CURRENT_LANGUAGE %}

<!DOCTYPE html>
<html lang="{{ CURRENT_LANGUAGE }}">
  <head>
    <title>
      {% block head_title %}
        {% trans "Product" %}
      {% endblock head_title %}
    </title>
    <meta charset="UTF-8" />
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="{% static "libs/tabler/tabler1.5.1.min.css" %}" rel="stylesheet" />
    <link href="{% static "css/theme.css" %}" rel="stylesheet" />
    <script defer src="{% static "libs/tabler/tabler1.5.1.min.js" %}"></script>
    <script defer src="{% static "libs/alpine/alpine3.17.3.min.js" %}"></script>
    {% htmx_script %}
  </head>
  <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
    {% block page %}
    {% endblock page %}
    <div id="messages-container"
         class="toast-container position-fixed bottom-0 end-0 p-3 z-3"
         hx-get="{% url "core:hx-messages" %}"
         hx-trigger="fetch-messages from:body"
         hx-swap="afterbegin">{% include "snippets/messages.html" %}</div>
    <script>
      document.cookie = `{{ TIMEZONE_COOKIE_NAME }}=${Intl.DateTimeFormat().resolvedOptions().timeZone}; path=/; max-age=31536000; samesite=lax`;
    </script>
    <script>
      const recoverFromHtmxError = (event) => {
        if (event.detail.boosted) {
          window.location.assign(event.detail.pathInfo.requestPath);
        }
      };
      document.body.addEventListener("htmx:responseError", recoverFromHtmxError);
      document.body.addEventListener("htmx:sendError", recoverFromHtmxError);
    </script>
  </body>
</html>
