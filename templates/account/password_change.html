{% comment %} NOTE: this template is used as a partial on the settings page {% endcomment %}

<div id="password-change-container">
  <p class="text-secondary">Update your password to keep your account secure.</p>
  <form method="post"
        hx-post="{% url "account_change_password" %}"
        hx-target="#password-change-container"
        hx-swap="outerHTML"
        hx-disabled-elt="#password-form-submit"
        hx-indicator="#password-form-spinner"
        x-data="{ dirty: false }"
        @input="dirty = true">
    {% csrf_token %}
    {{ redirect_field }}
    {{ password_change_form }}
    <div>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <button id="password-form-submit" type="submit" class="btn btn-primary" :disabled="!dirty">Change Password</button>
        <div class="d-flex align-items-center">
          <a href="{% url 'account_reset_password' %}" class="btn btn-outline">Forgot Password?</a>
          <span id="password-form-spinner" class="spinner-border spinner-border-sm ms-2 htmx-indicator"></span>
        </div>
      </div>
    </div>
  </form>
</div>
