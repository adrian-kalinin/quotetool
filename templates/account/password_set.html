{% comment %} NOTE: this template is used as a partial on the settings page {% endcomment %}

{% load tabler_icons %}

<div id="password-change-container">
  <div class="alert alert-info">
    {% tabler_icon "info-circle" %}
    Set a password for your account to enable password-based login.
  </div>
  <form method="post"
        hx-post="{% url "account_set_password" %}"
        hx-target="#password-change-container"
        hx-swap="outerHTML"
        hx-disabled-elt="#password-form-submit"
        hx-indicator="#password-form-spinner"
        x-data="{ dirty: false }"
        @input="dirty = true">
    {% csrf_token %}
    {{ redirect_field }}
    {{ password_set_form }}
    <div>
      <button id="password-form-submit" type="submit" class="btn btn-primary" :disabled="!dirty">Set Password</button>
      <span id="password-form-spinner" class="spinner-border spinner-border-sm ms-2 htmx-indicator"></span>
    </div>
  </form>
</div>
